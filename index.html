<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="AetherHealth: offline health monitoring for astronauts on deep-space missions"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('aetherhealth-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light'; // light is the default
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>AetherHealth</title>
  </head>
  <body class="bg-void text-star">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
